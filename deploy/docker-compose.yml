# Production stack for one VPS.  From this folder:
#   cp .env.example .env   (fill it in)
#   docker compose up -d --build
# Keep container logs from filling the disk: 10 MB x 5 files per container.
x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "5" }

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: digimart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: digimart360
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digimart -d digimart360"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies database migrations, then exits. The API starts only after it succeeds.
  migrate:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://digimart:${POSTGRES_PASSWORD}@db:5432/digimart360?schema=public
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://digimart:${POSTGRES_PASSWORD}@db:5432/digimart360?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY}
      CORS_ORIGINS: https://${DOMAIN}
      WEB_URL: https://${DOMAIN}
      MEDIA_BASE_URL: https://${DOMAIN}/media
      ROOT_DOMAIN: ${DOMAIN}
      SITES_TARGET: sites.${DOMAIN}
      UPLOAD_DIR: /data/uploads
      # Optional: store photos on Cloudinary instead of the uploads volume.
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-DIGI MART 360 <no-reply@digimart360.com>}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
    restart: unless-stopped
    logging: *logging
    environment:
      SITE_URL: https://${DOMAIN}
      ROOT_DOMAIN: ${DOMAIN}
      API_URL: http://api:3000/api/v1
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      ALLOW_INDEXING: ${ALLOW_INDEXING:-false}
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
