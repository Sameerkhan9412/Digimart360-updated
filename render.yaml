# Render blueprint for the API (free plan). The website goes on Vercel; the database on Neon.
# Steps: docs/DEPLOY-FREE.md
services:
  - type: web
    name: digimart-api
    runtime: docker
    plan: free
    # Same region as the Neon database (us-east-2, Ohio) so queries are fast.
    region: ohio
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    # Apply migrations, make sure the admin exists, optionally load demo data, then start.
    # Seeding (admin + demo data) is run once from a laptop: ts-node is too heavy for the free 512 MB instance.
    # Render does not run this through a shell, so the && chain lives in an npm script.
    dockerCommand: npm run start:render
    envVars:
      - key: PORT
        value: "3000"
      # Neon's direct (unpooled) connection string with sslmode=require only. Remove "&channel_binding=require" if present.
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_DEMO
        value: "true"
      # The Vercel website's address, e.g. https://digimart360.vercel.app
      - key: WEB_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Photos are stored on Cloudinary (Render's disk is wiped on every restart).
      # Format: cloudinary://API_KEY:API_SECRET@CLOUD_NAME (Cloudinary dashboard > API Keys)
      - key: CLOUDINARY_URL
        sync: false
      # console = sign-in codes appear in the Render logs (fine for a private demo).
      # Switch to smtp + SMTP_URL (e.g. Brevo free) before real users arrive.
      - key: MAIL_TRANSPORT
        value: console
      # Production normally refuses console mail; this opt-in is for the private demo only.
      - key: ALLOW_CONSOLE_MAIL
        value: "true"
      - key: SMTP_URL
        sync: false
      - key: ROOT_DOMAIN
        value: localhost
