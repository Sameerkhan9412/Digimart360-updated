# Pings the free Render API so it does not fall asleep after ~15 idle minutes.
# Remove this file when the API moves to paid hosting.
name: keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API health
        run: curl -fsS --max-time 90 --retry 2 --retry-delay 5 https://digimart-api.onrender.com/api/v1/health
