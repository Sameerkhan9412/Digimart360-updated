name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · type check, tests, migrations, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: digimart
          POSTGRES_PASSWORD: digimart
          POSTGRES_DB: digimart360
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U digimart -d digimart360"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://digimart:digimart@localhost:5432/digimart360?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      SEED_ADMIN_EMAIL: admin@digimart360.local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply migrations to a fresh database
        run: npm run db:deploy -w @digimart/api
      - name: Seed
        run: npm run db:seed -w @digimart/api
      - run: npm run lint
      - run: npm test
      - run: npm run build
