name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API + website · type check, unit + end-to-end tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: digimart
          POSTGRES_PASSWORD: digimart
          POSTGRES_DB: digimart360_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U digimart -d digimart360_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://digimart:digimart@localhost:5432/digimart360_test?schema=public
      TEST_DATABASE_URL: postgresql://digimart:digimart@localhost:5432/digimart360_test?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      INTERNAL_API_KEY: ci-only-internal-key-that-is-at-least-32-characters
      SEED_ADMIN_EMAIL: admin@digimart360.local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: End-to-end tests (rebuilds the test DB from all migrations, loads demo data)
        run: npm run test:e2e -w @digimart/api
      - name: Build API and website
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Website image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: NEXT_PUBLIC_API_URL=https://example.test/api/v1
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Compose file is valid
        working-directory: deploy
        run: docker compose config -q
        env:
          DOMAIN: example.test
          ACME_EMAIL: ops@example.test
          POSTGRES_PASSWORD: x
          JWT_ACCESS_SECRET: x
          INTERNAL_API_KEY: x
