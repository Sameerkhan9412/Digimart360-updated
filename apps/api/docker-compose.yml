services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: digimart
      POSTGRES_PASSWORD: digimart
      POSTGRES_DB: digimart360
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digimart -d digimart360"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
